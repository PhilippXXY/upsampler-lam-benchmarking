# End-to-end upsampler + LAM training configuration.

# --- Training Runtime & Global Defaults ---
training:
  seed: 0
  device: "mps"
  epochs: 2
  learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  frame_batch_size: 32
  gradient_clip_norm: 1.0
  num_workers: 0
  max_train_files: 0
  max_val_files: 0
  log_every_files: 10
  early_stopping_patience: 3
  early_stopping_min_delta: 0.0
  resume_from_checkpoint: ""
  output_root: "output/training_end_to_end"
  checkpoint_dir: "src/lam_min/checkpoints/e2e"
  checkpoint_prefix: ""
  freeze_upsampler: false

  # --- Multi-Stage ---
  stages:
    - name: "pretrain_audiblelight_light"
      enabled: true
      epochs: 8
      learning_rate: 1.0e-6
      weight_decay: 1.0e-4
      max_train_files: 0
      max_val_files: 0
      train_sampling: "proportional"
      early_stopping_patience: 3
      early_stopping_min_delta: 0.0
      datasets:
        audiblelight: true
        eigenscape: false

    - name: "finetune_mixed_light"
      enabled: true
      epochs: 4
      learning_rate: 1.0e-6
      weight_decay: 1.0e-4
      max_train_files: 0
      max_val_files: 0
      train_sampling: "balanced"
      early_stopping_patience: 2
      early_stopping_min_delta: 0.0
      datasets:
        audiblelight: true
        eigenscape: true

# --- Checkpoint Initialisation ---
initialisation:
  upsampler_checkpoint: "src/upsampler/imdn/checkpoints/imdn.pth"
  lam_checkpoint: "src/lam_min/checkpoints/LAM.pth"
  resume_checkpoint: ""
  resume_strict: true

# --- End-to-End Loss Settings ---
loss:
  lam_method: "original_msetv"
  lam_tv_weight: 1.0e-5
  aux_enabled: true
  aux_weight: 0.25
  use_model_specific_aux_loss: true

# --- Wrapper Architecture & Model Hyperparameters ---
model:
  name: "BicubicLAM"              # Options: "UpLAM", "BicubicLAM", "SRCNNLAM", "IMDNLAM", "SAFMNLAM", "GANLAM", "AINNLAM", "VariableSRCNNLAM"
  in_channels: 4
  out_channels: 32
  feature_channels: 64
  mapping_channels: 32
  variable_input_channel_counts: [4, 8, 16, 24, 32]
  n_blocks: 8
  n_residual_blocks: 8
  ffn_scale: 2.0
  n_levels: 4
  hidden_channels: 64
  latent_channels: 64
  loss_name: "mse"
  fft_loss_weight: 0.1
  pde_loss_weight: 0.5
  pde_freq_min_hz: 100.0
  pde_freq_max_hz: 4000.0
  sound_speed: 343.0
  adversarial_weight: 0.01
  content_weight: 0.01
  critic_iters: 4
  discriminator_lr_scale: 5.0
  beta1_adam: 0.9
  beta2_adam: 0.999

# --- Dataset Composition & Preprocessing ---
data:
  low_channel_indices: [5, 9, 21, 25]
  sampling_rate: 24000
  nbands: 9

  # --- AudibleLight Split ---
  audiblelight:
    enabled: true
    root_path: "data/AudibleLight_Eigenmike32-5_DCASE-STARSS23_Dataset"
    split_ratio: [0.8, 0.1, 0.1]
    seed: 0
    cache_csm: true
    precomputed_csm_root: ""

  # --- Eigenscape Split ---
  eigenscape:
    enabled: true
    root_path: "data/eigenscape"
    split_ratio: [0.75, 0.125, 0.125]
    seed: 0
    cache_csm: true
    precomputed_csm_root: ""
    expected_channels: 32
    target_high_channels: 32
    allow_channel_fallback: false
